name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No `version:` here on purpose. action-setup@v4 errors out when the
      # version is declared both here and as `packageManager` in
      # package.json, so package.json stays the single source of truth.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build static export
        run: pnpm build

      - name: Generate timestamp
        id: ts
        run: echo "value=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: isagog-site-${{ steps.ts.outputs.value }}
          path: out
          retention-days: 7

      # isagog-web owns the isagog.com root, but only Isagog/isagog.github.io
      # (the org's user-site repo) can serve a GitHub Pages custom domain at
      # the apex while still letting Isagog/isagog-old live at a subpath
      # under it. So instead of deploying to isagog-web's own Pages site,
      # this pushes the build straight into isagog.github.io's gh-pages
      # branch, which is what Pages actually serves from over there.
      - name: Publish to isagog.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ISAGOG_GITHUB_IO_DEPLOY_TOKEN }}
          external_repository: Isagog/isagog.github.io
          publish_branch: gh-pages
          publish_dir: ./out
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
